name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: '@vplayer'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify packages
        run: |
          bun run typecheck
          bun run test
          bun run lint
          bun run --cwd packages/core build
          bun run --cwd packages/react build
          bun pm pack --cwd packages/core --dry-run
          bun pm pack --cwd packages/react --dry-run

      - name: Publish core
        run: npm publish --workspace packages/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish React
        run: npm publish --workspace packages/react --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
